<!DOCTYPE html>
<html>
<head>
  <title>RabbiMart Register</title>
</head>
<body style="background:#0f172a; color:white; font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh;">
  <div style="background:#1e293b; padding:30px; border-radius:10px; width:320px;">
    <h2 style="text-align:center;">Create Account</h2>

    <input type="text" placeholder="Full Name" style="width:100%; padding:10px; margin:10px 0;">

    <input type="email" placeholder="Email" style="width:100%; padding:10px; margin:10px 0;">

    <input type="password" placeholder="Password" style="width:100%; padding:10px; margin:10px 0;">

    <select style="width:100%; padding:10px; margin:10px 0;">
      <option>Buyer</option>
      <option>Seller</option>
    </select>

    <button style="width:100%; padding:10px; background:#16a34a; color:white; border:none;">
      Register
    </button>

    <p style="text-align:center;"><a href="login.html" style="color:#60a5fa;">Back to Login</a></p>
  </div>
</body>
</html>
