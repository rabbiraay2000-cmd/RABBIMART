<!DOCTYPE html>
<html>
<head>
    <title>RABBIMART Login</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f4; }
        .login-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px grey; }
        input { display: block; margin: 10px 0; padding: 10px; width: 200px; }
        button { width: 100%; padding: 10px; background: blue; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>RABBIMART Login</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if(data.status === 'success') {
                localStorage.setItem('user_name', data.name);
                localStorage.setItem('user_email', data.email || email);
                localStorage.setItem('user_role', data.role);
                alert('Welcome ' + data.name);
                if(data.role === 'admin') window.location.href = 'admin.html';
                else if(data.role === 'seller') window.location.href = 'seller.html';
                else window.location.href = 'buyer.html';
            } else { alert('Login Failed!'); }
        }
    </script>
</body>
</html>
