<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RabbiMart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        h2 {
            color: #0f172a;
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        p.subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #2563eb;
        }
        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
        .footer-text a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="icon">🛍️</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your RabbiMart account</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address / Username</label>
                <input type="text" id="email" placeholder="name@example.com" value="rabbiraay2000@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" value="password123" required>
            </div>

            <div class="form-group">
                <label for="role">Select Portal Role</label>
                <select id="role">
                    <option value="buyer">Buyer Portal</option>
                    <option value="seller">Seller Portal</option>
                    <option value="admin">Admin Suite</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <p class="footer-text">
            Don't have an account? <a href="register.html">Create one</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.innerText = 'Authenticating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    localStorage.setItem('user_name', data.name);
                    localStorage.setItem('user_email', data.email || email);
                    localStorage.setItem('user_role', data.role);
                    const role = (data.role || '').toLowerCase();
                    if (role === 'admin') window.location.href = "admin.html";
                    else if (role === 'seller') window.location.href = "seller.html";
                    else window.location.href = "buyer.html";
                } else {
                    alert(data.message || 'Login Failed!');
                    btn.innerText = 'Sign In';
                    btn.disabled = false;
                }
            } catch (err) {
                alert('Server connection error!');
                btn.innerText = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>

</body>
</html>
