<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - RabbiMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            padding: 1.5rem;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .logo {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #0f172a;
        }

        .header p {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #fff;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px -4px rgba(79, 70, 229, 0.3);
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #64748b;
        }

        .footer-text a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .alert-msg {
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .alert-error {
            background: #fee2e2;
            color: #ef4444;
        }

        .alert-success {
            background: #dcfce7;
            color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="logo">🚀</div>
            <h1>Create Account</h1>
            <p>Join RabbiMart to buy or sell products</p>
        </div>

        <div class="alert-msg" id="alertBox"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required>
            </div>

            <div class="form-group">
                <label for="role">Select Role</label>
                <select id="role" required>
                    <option value="buyer">Buyer (Shop products)</option>
                    <option value="seller">Seller (Post products)</option>
                    <option value="admin">Admin (Manage platform)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Register Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            alertBox.style.display = 'none';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;

            submitBtn.innerText = 'Creating account...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });

                const res = await response.json();

                if (res.status === 'success') {
                    alertBox.className = 'alert-msg alert-success';
                    alertBox.innerText = 'Account created successfully! Redirecting to login...';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    alertBox.className = 'alert-msg alert-error';
                    alertBox.innerText = res.message || 'Registration failed!';
                    alertBox.style.display = 'block';
                    submitBtn.innerText = 'Register Account';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                alertBox.className = 'alert-msg alert-error';
                alertBox.innerText = 'Server connection error!';
                alertBox.style.display = 'block';
                submitBtn.innerText = 'Register Account';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
