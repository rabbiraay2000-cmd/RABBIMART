<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - RabbiMart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; }
        header {
            background: #ffffff; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        .nav-container {
            max-width: 1100px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.4rem; font-weight: 700; color: #4f46e5; text-decoration: none; }
        .btn-logout {
            background: #ef4444; color: white; border: none; padding: 0.45rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 600;
        }
        .container { max-width: 1100px; margin: 2.5rem auto; padding: 0 1.5rem; display: grid; grid-template-columns: 1fr 1.2fr; gap: 2rem; }
        @media(max-width: 850px) { .container { grid-template-columns: 1fr; } }

        .card {
            background: #ffffff; padding: 2rem; border-radius: 16px; border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .card h2 { font-size: 1.4rem; margin-bottom: 0.5rem; color: #0f172a; }
        .seller-badge {
            display: inline-block; background: #f1f5f9; color: #475569; padding: 0.3rem 0.6rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 1.5rem;
        }
        .form-group { margin-bottom: 1.15rem; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.4rem; color: #334155; }
        .form-group input, .form-group select {
            width: 100%; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; outline: none; background: #fff;
        }
        .btn-submit {
            width: 100%; background: #4f46e5; color: white; border: none; padding: 0.85rem; border-radius: 8px;
            font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s;
        }
        .btn-submit:hover { background: #4338ca; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.88rem; }
        th { text-align: left; padding: 0.6rem; background: #f8fafc; color: #64748b; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        td { padding: 0.75rem 0.6rem; border-bottom: 1px solid #f1f5f9; color: #334155; }

        .status-tag {
            padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700;
        }
        .status-Pending { background: #fef3c7; color: #d97706; }
        .status-Shipped { background: #e0e7ff; color: #4338ca; }
        .status-Delivered { background: #dcfce7; color: #16a34a; }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="#" class="logo">📦 RabbiMart Seller</a>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Form -->
        <div class="card">
            <h2>Add New Product</h2>
            <div class="seller-badge" id="sellerInfo">Seller: Loading...</div>

            <form id="productForm">
                <div class="form-group">
                    <label for="name">Product Name</label>
                    <input type="text" id="name" placeholder="e.g. Wireless Mechanical Keyboard" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Books">Books</option>
                        <option value="Gaming">Gaming</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price" placeholder="e.g. 2999" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="imageUrl">Image URL</label>
                    <input type="url" id="imageUrl" placeholder="https://images.unsplash.com/...">
                </div>
                <button type="submit" class="btn-submit">Publish Product</button>
            </form>
        </div>

        <!-- Recent Store Orders -->
        <div class="card">
            <h2>Recent Store Orders 📦</h2>
            <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 1rem;">Live customer purchases from the store</p>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="ordersList">
                        <tr><td colspan="3" style="text-align: center; color: #94a3b8;">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const userEmail = localStorage.getItem('user_email');
        const userName = localStorage.getItem('user_name');
        const userRole = localStorage.getItem('user_role');

        if (!userEmail || userRole.toLowerCase() !== 'seller') {
            alert('Please login as a seller to access this page.');
            window.location.href = 'login.html';
        } else {
            document.getElementById('sellerInfo').innerText = `👤 ${userName} (${userEmail})`;
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                seller_email: userEmail,
                category: document.getElementById('category').value,
                image_url: document.getElementById('imageUrl').value.trim()
            };

            const response = await fetch('/api/products/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const res = await response.json();
            alert(res.message);
            if (res.status === 'success') {
                document.getElementById('name').value = '';
                document.getElementById('price').value = '';
                document.getElementById('imageUrl').value = '';
            }
        });

        async function loadSellerOrders() {
            try {
                const response = await fetch('/api/orders');
                const res = await response.json();
                const tbody = document.getElementById('ordersList');
                tbody.innerHTML = '';

                if (res.orders && res.orders.length > 0) {
                    res.orders.forEach(o => {
                        const statusClass = `status-${o.status || 'Pending'}`;
                        tbody.innerHTML += `
                            <tr>
                                <td style="font-weight: 600;">${o.product_name} <br><small style="color:#64748b;">(Qty: ${o.quantity})</small></td>
                                <td style="color: #10b981; font-weight: 700;">₹${o.total_price}</td>
                                <td><span class="status-tag ${statusClass}">${o.status || 'Pending'}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #94a3b8;">No orders placed yet.</td></tr>';
                }
            } catch (err) { console.error(err); }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        loadSellerOrders();
    </script>
</body>
</html>
